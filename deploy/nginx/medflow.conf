# MedFlow 生产部署 — nginx 配置模板
# 用法：复制到 /etc/nginx/sites-available/medflow.conf，然后 ln -s 到 sites-enabled/，
#      把你创建的证书放到 /etc/ssl/medflow/（origin.pem + origin.key），nginx -t 后 reload。
#
# 前提：
#   1. 三个前端 dist 已上传到 /var/www/medflow/{admin,doctor,patient}
#   2. 后端 uvicorn 运行在 127.0.0.1:8000
#   3. 证书由你自己创建，放 /etc/ssl/medflow/origin.pem 和 origin.key（路径可自行改）

# ---- HTTP → HTTPS 跳转（三条都跳）----
server {
    listen 80;
    server_name admin.medflow.kdns.fr doctor.medflow.kdns.fr patient.medflow.kdns.fr;
    return 301 https://$host$request_uri;
}

# ================= admin =================
server {
    listen 443 ssl http2;
    server_name admin.medflow.kdns.fr;

    ssl_certificate     /etc/ssl/medflow/origin.pem;
    ssl_certificate_key /etc/ssl/medflow/origin.key;

    root /var/www/medflow/admin;
    index index.html;

    # Vue Router history 模式：所有非静态路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 静态资源缓存（dist 带 hash 的文件名）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

